<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Smile POS — เชื่อมต่อ Server</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-muted: #f8fafc;
      --line: #dde5ef;
      --line-strong: #c6d2e1;
      --text: #172033;
      --muted: #667085;
      --green: #148f64;
      --green-dark: #0f7553;
      --blue: #2563eb;
      --shadow: 0 18px 55px rgba(15, 23, 42, 0.12);
      --radius: 10px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: "Kanit", "Segoe UI", Roboto, "Noto Sans Thai", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
    }

    button, input { font: inherit; }
    button { border: 0; }
    [hidden] { display: none !important; }

    .page {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: calc(var(--safe-top) + 20px) 20px calc(var(--safe-bottom) + 20px);
      gap: 18px;
      max-width: 560px;
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-top: 8px;
    }

    .brand-mark {
      width: 58px;
      height: 58px;
      flex: 0 0 auto;
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    .brand-mark img { width: 40px; height: 40px; object-fit: contain; }

    .brand-copy { display: grid; gap: 3px; min-width: 0; }
    .brand-copy h1 { margin: 0; font-size: 22px; font-weight: 800; line-height: 1.2; }
    .brand-copy p { margin: 0; color: var(--muted); font-size: 13px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      display: grid;
      gap: 16px;
    }

    .field { display: grid; gap: 8px; }

    label { font-size: 14px; font-weight: 800; }

    input {
      width: 100%;
      height: 56px;
      padding: 0 16px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      outline: none;
      color: var(--text);
      background: #ffffff;
      font-size: 17px;
      -webkit-user-select: text;
      user-select: text;
    }

    input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14); }
    input:disabled { opacity: 0.6; }

    .hint { color: var(--muted); font-size: 12px; line-height: 1.55; }

    .btn {
      min-height: 56px;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 18px;
      border-radius: var(--radius);
      font-weight: 800;
      font-size: 16px;
      transition: background 140ms ease, opacity 140ms ease;
    }

    .btn svg { width: 20px; height: 20px; flex: 0 0 auto; }
    .btn:disabled { opacity: 0.6; }
    .btn:active:not(:disabled) { opacity: 0.85; }

    .btn-primary { color: #fff; background: var(--green); box-shadow: 0 10px 24px rgba(20, 143, 100, 0.26); }
    .btn-secondary { color: var(--text); background: #fff; border: 1px solid var(--line-strong); }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .status {
      min-height: 56px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--surface-muted);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .status.success { color: #05603a; background: #ecfdf3; border-color: #abefc6; }
    .status.error { color: #9a3412; background: #fff7ed; border-color: #fed7aa; }
    .status.loading { color: #1d4ed8; background: #eff6ff; border-color: #bfdbfe; }

    .spinner {
      width: 18px; height: 18px; flex: 0 0 auto;
      border-radius: 50%;
      border: 2px solid rgba(37, 99, 235, 0.22);
      border-top-color: var(--blue);
      animation: spin 780ms linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .recent { display: grid; gap: 8px; }
    .recent-title { font-size: 13px; font-weight: 800; color: var(--muted); }

    .recent-item {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      border-radius: var(--radius);
      background: var(--surface-muted);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 15px;
      text-align: left;
    }

    .recent-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .recent-item svg { width: 18px; height: 18px; flex: 0 0 auto; color: var(--muted); }

    .footer { margin-top: auto; text-align: center; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <main class="page">
    <header class="brand">
      <div class="brand-mark"><img src="app-icon.png" alt=""></div>
      <div class="brand-copy">
        <h1>Smile POS</h1>
        <p>เชื่อมต่อกับเครื่อง Server ในร้าน</p>
      </div>
    </header>

    <section class="card">
      <div class="field">
        <label for="serverInput">ที่อยู่ Server</label>
        <input
          type="text"
          id="serverInput"
          inputmode="url"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          placeholder="192.168.1.100">
        <span class="hint" id="hint">
          กรอกเฉพาะเลข IP ของเครื่องเคาน์เตอร์ก็พอ ระบบจะเติมพอร์ต 4500 ให้อัตโนมัติ
          <br>ถ้าร้านใช้พอร์ตอื่น ให้กรอกต่อท้าย เช่น 192.168.1.100:4001
        </span>
      </div>

      <button class="btn btn-primary" type="button" id="btnConnect">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path>
        </svg>
        เชื่อมต่อ
      </button>

      <div class="btn-row">
        <button class="btn btn-secondary" type="button" id="btnScan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
            <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
            <path d="M7 12h10"></path>
          </svg>
          สแกน QR
        </button>
        <button class="btn btn-secondary" type="button" id="btnTest">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6 9 17l-5-5"></path>
          </svg>
          ทดสอบ
        </button>
      </div>

      <div class="status" id="status" role="status" aria-live="polite">
        กรอกที่อยู่ Server แล้วกดเชื่อมต่อ
      </div>

      <div class="recent" id="recentBox" hidden>
        <div class="recent-title">เคยเชื่อมต่อล่าสุด</div>
        <div id="recentList"></div>
      </div>
    </section>

    <div class="footer">
      Smile Pharmacy POS · <span id="shellVersion">shell</span>
    </div>
  </main>

  <script src="connect.js"></script>
</body>
</html>
