  <rect x="108" y="192" width="17" height="56" rx="8.5" fill="#F7D8B6"/>
  <rect x="127" y="202" width="17" height="46" rx="8.5" fill="#F7D8B6"/>
  <rect x="66" y="228" width="80" height="76" rx="30" fill="#F7D8B6"/>
  <rect x="52" y="250" width="40" height="22" rx="11" fill="#F7D8B6" transform="rotate(-35 72 261)"/>

