  <path d="M400 258q2-12 12-14" stroke="#5C3A21" stroke-width="7"/>
  <circle cx="400" cy="284" r="26" fill="#EF4444"/>
  <path d="M412 244c12-6 24 0 22 10-10 6-20 0-22-10z" fill="#3E9B52" stroke-width="7"/>
  <rect x="428" y="252" width="26" height="58" rx="13" fill="#DDA455" stroke-width="8" transform="rotate(14 441 281)"/>
  <path d="M330 328v66q0 16 16 16h90q16 0 16-16v-66z" fill="#D9C4A9"/>
  <path d="M322 304h138l-8 28H330z" fill="#BFA688"/>
  <path d="M383 336v70" stroke="#BFA688" stroke-width="7"/>

