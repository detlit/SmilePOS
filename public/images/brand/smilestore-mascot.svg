<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 20 452 490" role="img" aria-label="SmileStore POS mascot">
<title>SmileStore POS mascot</title>
<g fill="none" stroke="#13314F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
