  <path d="M266 356h48v62a24 24 0 0 1-48 0z" fill="#1E3A5F"/>
  <!-- shoes -->
  <rect x="182" y="416" width="78" height="38" rx="19" fill="#0E2740"/>
  <rect x="258" y="416" width="78" height="38" rx="19" fill="#0E2740"/>

